[general]
# Profile tuned for MacBookPro14,3 (15" 2017, i7-7920HQ, Tjmax 100C).
#
# REVISED 2026-08-01. The previous profile (75/82/99) optimised for silence and
# succeeded -- time at full speed went from 50% to 3%. But it optimised for the
# opposite of machine longevity, and measurement made that plain: with the fans
# pinned at their 2160 rpm floor, the package sat at a mean of 64.7C and spiked
# to 88C without the fan responding at all, because ramping did not begin until
# 82C. The full 2160-5927 rpm range went unused. These values keep the
# anti-surge machinery and give back some of the silence.
#
# Why these values (mbpfan 2.4.0 algorithm):
#   * mbpfan reads the *instantaneous max* core temperature every poll.
#     On this CPU that value swings 65 -> 95C within a single second on any
#     turbo burst, so thresholds must not sit where a spike triggers them.
#   * Fan speed ratchets UP whenever temp is rising AND temp > high_temp.
#   * Fan speed snaps straight to maximum whenever temp >= max_temp.
#   * Fan speed only returns to minimum when temp <= low_temp (instantly).
#   The original values (63/66/86) sat *inside* the idle band, so nearly every
#   poll either slammed the fan to max or snapped it back to min.
#
# Fan speeds are read from the applesmc driver:
#   fan1 (left)  min 2160 / max 5927
#   fan2 (right) min 2000 / max 5489
# Uncomment to override:
#min_fan1_speed = 2160
#max_fan1_speed = 5927
#min_fan2_speed = 2000
#max_fan2_speed = 5489

# temperature units in celsius
low_temp = 65           # was 75. Sits at the bottom of the 64-73C light-work
                        # band rather than above it, so the fan no longer snaps
                        # back to minimum the instant a burst ends.
high_temp = 75          # was 82. Ramping begins 7C earlier, so the sustained
                        # heat that used to be ignored entirely now gets some
                        # airflow. Between low and high the fan simply holds,
                        # and that hold band is what keeps this from surging:
                        # ordinary work lives in it and produces no changes.
max_temp = 95           # was 99. Still 5C below Tjmax, and the 75-95C ramp is
                        # a 20C span so each step stays gentle, but a genuinely
                        # sustained load now reaches full speed instead of
                        # creeping towards it.
polling_interval = 7    # unchanged, and load-bearing. A 7s sample filters the
                        # sub-second spikes, so an 88C reading at this interval
                        # means real heat rather than a transient, and
                        # responding to it is correct.
