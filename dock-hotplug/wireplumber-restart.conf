# Restart WirePlumber even on a clean exit.
#
# Why this exists: on 2026-08-01 WirePlumber was ended from the GNOME
# Resources task manager while chasing a hung Steam game. It exited
# gracefully (status=0/SUCCESS), and because the shipped unit is
# Restart=on-failure, systemd correctly declined to restart it. PipeWire kept
# running, but PipeWire without a session manager creates no device nodes at
# all -- so every audio device disappeared and stayed gone for 2h38m. Games
# launched after that died within ~30s at audio init, which made the failure
# look like a graphics or Steam problem rather than a dead session manager.
#
# Restart=always covers the exit-0 case that on-failure deliberately ignores.
# A unit stopped by systemd itself -- session teardown, or BindsTo=pipewire
# stopping -- is still not restarted, so this does not fight logout.
#
# The default start limit (5 starts / 10s) is left in place on purpose: if
# WirePlumber is genuinely broken and cannot stay up, it should give up rather
# than spin. RestartSec is raised from the stock 100ms so a real crash loop
# hits that limit as a limit, not as a tight spin.
#
# Installed to ~/.config/systemd/user/wireplumber.service.d/override.conf

[Service]
Restart=always
RestartSec=2
